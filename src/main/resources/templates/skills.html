<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Explore skills · SkillSwap</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><nav th:replace="~{fragments :: nav}"></nav><main class="page-wrap"><section class="welcome-row"><div><div class="section-kicker">THE COMMUNITY EXCHANGE</div><h1>Find your next <span>skill.</span></h1><p class="muted">Learn directly from people who love what they do.</p></div></section>
<form class="search-bar" method="get" action="/skills"><input name="q" th:value="${q}" placeholder="Search skills, e.g. Java, guitar, design…" aria-label="Search skills"><button class="button primary" type="submit">Search</button></form>
<div th:if="${#lists.isEmpty(listings)}" class="empty-state panel"><div class="empty-icon">⌕</div><h3>No skills found just yet.</h3><p>Try a different search, or come back as the community grows.</p></div>
<div class="skill-grid marketplace"><article class="skill-card market-card" th:each="skill : ${listings}"><div class="skill-card-top"><span class="pill teach">CAN TEACH</span><span class="category" th:text="${skill.category}">Technology</span></div><h3 th:text="${skill.title}">Java fundamentals</h3><p th:text="${skill.description == null || skill.description.isBlank() ? 'Ready to share this skill with another curious learner.' : skill.description}">Description</p><div class="teacher-row"><div class="request-avatar" th:text="${#strings.substring(skill.owner.name,0,1)}">A</div><div><strong th:text="${skill.owner.name}">Alex</strong><small>Skill guide</small></div></div><form th:action="@{/requests}" method="post" class="request-form"><input type="hidden" name="skillId" th:value="${skill.id}"><textarea name="message" maxlength="500" placeholder="Say hello or share what you'd like to learn (optional)"></textarea><button class="button primary full" type="submit">Request an exchange →</button></form></article></div>
</main><footer th:replace="~{fragments :: footer}"></footer></body></html>
