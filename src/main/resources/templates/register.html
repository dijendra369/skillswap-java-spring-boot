<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Join SkillSwap</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body class="auth-page"><a class="brand auth-brand" href="/">Skill<span>Swap</span></a><main class="auth-card">
  <div class="section-kicker">YOUR NEXT CHAPTER STARTS HERE</div><h1>Join the exchange.</h1><p class="muted">Create your free account and start learning from your community.</p>
  <div th:if="${error}" class="alert" th:text="${error}"></div>
  <form th:action="@{/register}" method="post" class="form-stack">
    <label>Your name<input type="text" name="name" th:value="${name}" required maxlength="60" autocomplete="name" placeholder="Alex Morgan"></label>
    <label>Email address<input type="email" name="email" th:value="${email}" required maxlength="120" autocomplete="email" placeholder="you@example.com"></label>
    <label>Password<input type="password" name="password" required minlength="8" maxlength="72" autocomplete="new-password" placeholder="At least 8 characters"><small>Use at least 8 characters.</small></label>
    <button class="button primary full" type="submit">Create account <span>→</span></button>
  </form><p class="auth-bottom">Already a member? <a href="/login">Log in</a></p>
</main></body></html>
